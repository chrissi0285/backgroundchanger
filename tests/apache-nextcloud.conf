<VirtualHost *:80>
	ServerName wechselbild-nc34-test
	DocumentRoot /var/www/nextcloud

	<Directory /var/www/nextcloud>
		Require all granted
		AllowOverride All
		Options FollowSymLinks MultiViews
	</Directory>

	ErrorLog ${APACHE_LOG_DIR}/wechselbild-error.log
	CustomLog ${APACHE_LOG_DIR}/wechselbild-access.log combined
</VirtualHost>
