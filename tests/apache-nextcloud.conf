<VirtualHost *:80>
	ServerName backgroundchanger-nc34-test
	DocumentRoot /var/www/nextcloud

	<Directory /var/www/nextcloud>
		Require all granted
		AllowOverride All
		Options FollowSymLinks MultiViews
	</Directory>

	ErrorLog ${APACHE_LOG_DIR}/backgroundchanger-error.log
	CustomLog ${APACHE_LOG_DIR}/backgroundchanger-access.log combined
</VirtualHost>
